<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Login</title>
        <!--react will be connected here-->        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" >

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet" >

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="site-header">
            <div class="site-title">
                <a href="index.html">Divergent Threads</a>
            </div>

            <nav class="site-nav">
                <a href="index.html">home</a>
                <a href="login.html">login</a>
                <a href="character.html">my character</a>
                <a href="menu.html">main menu</a>
            </nav>
        </header>

        <div id="root">
            <main class="login-page">
                <div class="login-container">
                    <header>
                        <h1>Divergent Threads</h1>
                    </header>
                    <!--login section-->
                    <section class="mb-3">
                        <h2>Login</h2>
                        <form id="login-form" action="character.html"> <!--react will authenticate login info-->
                            <label for="login-username" class="form-label">Username</label>
                            <input
                            type="text"
                            id="login-username"
                            name="username"
                            class="form-control"
                            placeholder="enter your username"
                            required
                            >

                            <label for="login-password">Password</label>
                            <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="enter your password"
                            required
                            >

                            <button type="submit" class="game-button primary-button">Login</button>
                        </form>
                    </section>

                    <!--signup section-->
                    <section>
                        <h2>Create an account</h2>
                        <form id="signup-form" action="character.html">
                            <label for="signup-username" class="form-label">Username</label>
                            <input
                            type="text"
                            id="signup-username"
                            name="username"
                            class="form-control"
                            placeholder="choose a username"
                            >

                            <label for="signup-email">Email</label>
                            <input
                            type="email"
                            id="signup-email"
                            name="email"
                            placeholder="enter your email"
                            >
                            <label for="signup-password">Password</label>
                            <input
                            type="password"
                            id="signup-password"
                            name="password"
                            placeholder="create a password"
                            >
                            <button type="submit" class="game-button gold-button">
                                create account
                            </button>
                        </form>
                    </section>
                    <!--backend authentication will connect to these forms-->
                </div>
            </main>
        </div>
        <!--js will handle form submission-->
        <footer class="menu-footer">
            <span class="text-reset">Angela Edwards</span>
            <a href="https://github.com/angela-edwards/startup">GitHub</a>
        </footer>
    </body>
</html>
