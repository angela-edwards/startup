<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Login</title>
    </head>

    <body>
        <div id="root">
            <main>
                <header>
                    <h1>Diverging Threads</h1>
                    <p></p>
                </header>
                
                <section>
                    <h2>Login</h2>
                    <form id="login-form">
                        <label for="login-username">Username</label>
                        <input
                        type="text"
                        id="login-username"
                        name="username"
                        placeholder="enter your username"
                        >

                        <label for="login-password">Password</label>
                        <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="enter your password"
                        >

                        <button type="submit">Login</button>
                    </form>
                </section>

                <section>
                    <h2>Create an account</h2>
                    <form id="signup-form">
                        <label for="signup-username">Username</label>
                        <input
                        type="text"
                        id="signup-username"
                        name="username"
                        placeholder="choose a username"
                        >

                        <label for="signup-email">Email</label>
                        <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="enter your email"
                        >
                        <label for="signup-password">Password</label>
                        <input
                        type="password"
                        id="signup-password"
                        name="password"
                        placeholder="create a password"
                        >
                        <button type="submit">
                            create account
                        </button>
                    </form>
                </section>
            </main>
        </div>
    </body>
</html>
