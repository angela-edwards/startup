<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Login</title>
        <!--css will be added here-->
        <!--react will be connected here-->
    </head>

    <body>
        <div id="root">
            <main>
                <header>
                    <h1>Divergent Threads</h1>
                </header>
                <!--login section-->
                <section>
                    <h2>Login</h2>
                    <form id="login-form" action="character.html">
                        <label for="login-username">Username</label>
                        <input
                        type="text"
                        id="login-username"
                        name="username"
                        placeholder="enter your username"
                        required
                        >

                        <label for="login-password">Password</label>
                        <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="enter your password"
                        required
                        >

                        <button type="submit">Login</button>
                    </form>
                </section>

                <!--signup section-->
                <section>
                    <h2>Create an account</h2>
                    <form id="signup-form" action="character.html">
                        <label for="signup-username">Username</label>
                        <input
                        type="text"
                        id="signup-username"
                        name="username"
                        placeholder="choose a username"
                        >

                        <label for="signup-email">Email</label>
                        <input
                        type="email"
                        id="signup-email"
                        name="email"
                        placeholder="enter your email"
                        >
                        <label for="signup-password">Password</label>
                        <input
                        type="password"
                        id="signup-password"
                        name="password"
                        placeholder="create a password"
                        >
                        <button type="submit">
                            create account
                        </button>
                    </form>
                </section>
                <!--backend authentication will connect to these forms-->
            </main>
        </div>
        <!--js will handle form submission-->
        <footer>
            <hr />
            <span class="text-reset">Author Name</span>
            <br />
            <a href="https://github.com/angela-edwards/startup">GitHub</a>
        </footer>
    </body>
</html>
